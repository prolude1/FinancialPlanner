name: Podman image build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".dockerignore"
      - ".github/workflows/podman-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - ".dockerignore"
      - ".github/workflows/podman-build.yml"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  build-images:
    name: Build backend and web images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Build backend image
        run: podman build --tag financial-planner-backend:ci --file backend/Dockerfile .

      - name: Build web image
        run: podman build --tag financial-planner-web:ci --file web/Dockerfile web

      - name: Export images for scanning
        run: |
          podman save --format docker-archive --output backend-image.tar financial-planner-backend:ci
          podman save --format docker-archive --output web-image.tar financial-planner-web:ci

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ github.workspace }}/backend-image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ github.workspace }}/web-image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  sast:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-sca:
    name: Trivy dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan dependency manifests with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
